[workspace]
resolver = "2"
members = [
    "crates/airlock-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/bhavya/airlock"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1

# Benchmarks are built in release with debug symbols so profiles are readable.
[profile.bench]
debug = true
